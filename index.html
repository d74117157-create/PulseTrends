<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium PulseTrends Storefront</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .hero {
            background-image: url('hero-image.jpg');
            height: 100vh;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .product-tiers {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .cart {
            position: fixed;
            top: 20px;
            right: 20px;
        }
        .countdown {
            font-size: 2rem;
            color: yellow;
        }
        .trust-badges, .social-proof {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to PulseTrends Storefront</h1>
    </div>

    <div class="product-tiers">
        <div>
            <h2>Basic Tier</h2>
            <p>$10/month</p>
            <button onclick="addToCart('Basic')">Add to Cart</button>
        </div>
        <div>
            <h2>Standard Tier</h2>
            <p>$20/month</p>
            <button onclick="addToCart('Standard')">Add to Cart</button>
        </div>
        <div>
            <h2>Premium Tier</h2>
            <p>$30/month</p>
            <button onclick="addToCart('Premium')">Add to Cart</button>
        </div>
    </div>

    <div class="cart">
        <button onclick="viewCart()">🛒 View Cart</button>
    </div>

    <div class="countdown">
        <p>Special Offer Ends In: <span id="timer">00:00:00</span></p>
    </div>

    <div class="trust-badges">
        <img src="badge1.png" alt="Trust Badge 1">
        <img src="badge2.png" alt="Trust Badge 2">
    </div>

    <div class="social-proof">
        <p>Join 1000+ happy customers!</p>
    </div>

    <div class="ai-chatbot">
        <p>Need Help? <button onclick="openChatbot()">Chat with us!</button></p>
    </div>

    <div class="email-signup">
        <form>
            <label for="email">Sign up for our newsletter:</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Subscribe</button>
        </form>
    </div>

    <script>
        function addToCart(item) {
            // Add item to cart logic here
        }
        function viewCart() {
            // View cart logic here
        }
        function openChatbot() {
            // Open AI chatbot logic here
        }
        // Consider adding countdown timer logic here
    </script>
</body>
</html>
